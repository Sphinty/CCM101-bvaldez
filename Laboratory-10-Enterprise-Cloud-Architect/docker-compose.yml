services:
  database:
    image: mysql:8.0
    container_name: cloudnova-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: RootSuperSecurePassword2026!
      MYSQL_DATABASE: wordpress_db
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: UserSecurePassword2026!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - enterprise_backend

  webserver:
    image: wordpress:latest
    container_name: cloudnova-web
    restart: always
    ports:
      - "80:80"
    environment:
      WORDPRESS_DB_HOST: database:3306
      WORDPRESS_DB_NAME: wordpress_db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: UserSecurePassword2026!
    volumes:
      - wp_data:/var/www/html
    networks:
      - enterprise_backend
    depends_on:
      - database

volumes:
  db_data:
    driver: local
  wp_data:
    driver: local

networks:
  enterprise_backend:
    driver: bridge
